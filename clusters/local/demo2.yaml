apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:diyanme/gitops-infra.git
    targetRevision: main
    path: apps/demo2
  destination:
    server: https://kubernetes.default.svc
    namespace: demo2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
